name: Build, publish and deploy TaskFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate required repository secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test "$DOCKERHUB_USERNAME" = "anantkumar34" || (echo "DOCKERHUB_USERNAME must be exactly anantkumar34" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish backend images
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and publish frontend images
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Create deployment environment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          {
            printf 'POSTGRES_DB=taskflow\n'
            printf 'POSTGRES_USER=taskflow_user\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'DATABASE_URL=postgresql://taskflow_user:%s@postgres:5432/taskflow\n' "$POSTGRES_PASSWORD"
            printf 'REDIS_URL=redis://redis:6379\n'
            printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'PORT=3000\nFRONTEND_PORT=8080\nBACKEND_PORT=3000\n'
            printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
          } > .env

      - name: Validate image deployment Compose
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy published images
        run: docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 180

      - name: Verify deployment
        run: |
          curl --fail --silent http://localhost:3000/health
          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Deployment is healthy"

      - name: Install API test dependencies
        working-directory: tests
        run: npm ci

      - name: Test deployed API
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test

      - name: Summarize published images
        run: |
          {
            echo "## Published Docker Hub images"
            echo "- Backend images published with v1 and latest tags."
            echo "- Frontend images published with v1 and latest tags."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture deployment logs
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.deploy.yml ps
            docker compose -f docker-compose.deploy.yml logs --no-color
          else
            echo "Deployment environment was not created; there are no Compose logs to collect."
          fi

      - name: Clean up deployment
        if: always()
        # Keep named volumes intact. The GitHub-hosted runner is temporary, and
        # cleanup must never delete a database volume if this job is reused elsewhere.
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.deploy.yml down --remove-orphans || true
          else
            echo "Deployment environment was not created; nothing to clean up."
          fi
